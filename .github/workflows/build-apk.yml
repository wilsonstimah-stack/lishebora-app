name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config
        pip install buildozer cython==0.29.33
    
    - name: Build APK (Debug)
      run: |
        yes | buildozer android debug
    
    - name: Build APK (Release)
      # Building release version which produces AAB for Play Store
      run: |
        # yes | buildozer android release
        # For now, just debug output is fine for direct install
        echo "Build complete"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LisheBora-APK
        path: bin/*.apk
