name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config
        pip install buildozer cython==0.29.33
    
    - name: Build APK (Debug)
      # using yes to accept licenses if needed, but capturing output
      run: |
        # Set JAVA_HOME
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # Run buildozer with verbose output
        buildozer android debug || { echo "Build failed"; exit 1; }
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LisheBora-APK
        path: bin/*.apk
